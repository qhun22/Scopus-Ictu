[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scopus-ictu-backend"
version = "0.1.0"
description = "Backend service for the Scopus-Ictu identity reconciliation pipeline (M0 skeleton)."
requires-python = ">=3.11"
readme = {text = "Backend service for the Scopus-Ictu identity reconciliation pipeline.", content-type = "text/plain"}

# --- FROZEN STACK (M0 = placeholders only, no logic) ---
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",

    # Dependency placeholders per Architecture v1.1 — used in M1+.
    "rapidfuzz>=3.7",

    # One of the two must be chosen by M1; both declared to lock the
    # dependency surface area for M0.
    "pandas>=2.2",
    "polars>=0.20",

    # Authentication & security dependencies (M2.2)
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]