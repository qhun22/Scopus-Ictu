name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  ENVIRONMENT: test

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: test_db
      DB_DRIVER: postgresql+psycopg2
      BACKEND_CORS_ORIGINS: "http://localhost:5173"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ENVIRONMENT: test
      DSPACE_SNAPSHOT_PATH: "./data/snapshots/"
      SCOPUS_RAW_DIR: "./data/raw_scopus/"
      SCOPUS_IMPORT_MAX_BYTES: "20971520"
      SCOPUS_IMPORT_BATCH_SIZE: "100"
      SCOPUS_NORMALIZATION_BATCH_SIZE: "500"
      TEST_DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: |
          cd backend
          python -m pip install -e ".[dev]"

      - name: Alembic upgrade
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run tests
        run: |
          cd backend
          python -m pytest -q

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
