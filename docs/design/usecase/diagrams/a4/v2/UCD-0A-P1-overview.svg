<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2C3E50"/>
    </marker>
  </defs>

  <rect width="595" height="842" fill="white"/>

  <!-- Title -->
  <text x="297" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A252F">UCD-0A (1/6) — Tổng quan vai trò Quản trị viên</text>
  <text x="297" y="54" text-anchor="middle" font-size="13" fill="#1A252F">22 Use Case · 6 nhóm chức năng · Xem chi tiết trang 2–6</text>

  <!-- Actor ADMIN -->
  <circle cx="297" cy="98" r="14" fill="#FDEBD0" stroke="#B7770D" stroke-width="2"/>
  <line x1="297" y1="112" x2="297" y2="148" stroke="#B7770D" stroke-width="2"/>
  <line x1="272" y1="124" x2="322" y2="124" stroke="#B7770D" stroke-width="2"/>
  <line x1="297" y1="148" x2="272" y2="176" stroke="#B7770D" stroke-width="2"/>
  <line x1="297" y1="148" x2="322" y2="176" stroke="#B7770D" stroke-width="2"/>
  <text x="297" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A252F">Quản trị viên (ADMIN)</text>

  <!-- ====== ROW 1: XT and G3 (top) ====== -->

  <!-- XT: cx=130 cy=290 -->
  <ellipse cx="140" cy="295" rx="118" ry="52" fill="#D6EAF8" stroke="#2471A3" stroke-width="2"/>
  <text x="140" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A252F">Xác thực &amp; Giám sát</text>
  <text x="140" y="297" text-anchor="middle" font-size="12" fill="#2C3E50">UC-01 Đăng nhập</text>
  <text x="140" y="313" text-anchor="middle" font-size="12" fill="#2C3E50">UC-02  UC-03  UC-07</text>
  <text x="140" y="329" text-anchor="middle" font-size="11" fill="#666">(4 Use Case)</text>

  <!-- G3: cx=440 cy=290 -->
  <ellipse cx="440" cy="295" rx="118" ry="52" fill="#D6EAF8" stroke="#2471A3" stroke-width="2"/>
  <text x="440" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A252F">Nhóm 3: Công bố</text>
  <text x="440" y="297" text-anchor="middle" font-size="12" fill="#2C3E50">UC-13 Xem danh sách</text>
  <text x="440" y="313" text-anchor="middle" font-size="12" fill="#2C3E50">và chi tiết công bố</text>
  <text x="440" y="329" text-anchor="middle" font-size="11" fill="#666">(1 Use Case)</text>

  <!-- ====== ROW 2: G1 and G4 (middle) ====== -->

  <!-- G1: cx=140 cy=435 -->
  <ellipse cx="140" cy="435" rx="118" ry="52" fill="#D6EAF8" stroke="#2471A3" stroke-width="2"/>
  <text x="140" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A252F">Nhóm 1: Nhập dữ liệu</text>
  <text x="140" y="437" text-anchor="middle" font-size="12" fill="#2C3E50">UC-08  UC-08a</text>
  <text x="140" y="453" text-anchor="middle" font-size="12" fill="#2C3E50">UC-10  UC-10a</text>
  <text x="140" y="469" text-anchor="middle" font-size="11" fill="#666">(4 Use Case + 2 extend)</text>

  <!-- G4: cx=440 cy=435 -->
  <ellipse cx="440" cy="440" rx="118" ry="57" fill="#D6EAF8" stroke="#2471A3" stroke-width="2"/>
  <text x="440" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A252F">Nhóm 4: Chuẩn hóa</text>
  <text x="440" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A252F">&amp; Phê duyệt</text>
  <text x="440" y="450" text-anchor="middle" font-size="12" fill="#2C3E50">UC-11  UC-12  UC-17</text>
  <text x="440" y="466" text-anchor="middle" font-size="12" fill="#2C3E50">UC-18  UC-19</text>
  <text x="440" y="482" text-anchor="middle" font-size="11" fill="#666">(5 Use Case + 1 include)</text>

  <!-- ====== ROW 3: G2 and G5 (bottom) ====== -->

  <!-- G2: cx=140 cy=590 -->
  <ellipse cx="140" cy="590" rx="118" ry="57" fill="#D6EAF8" stroke="#2471A3" stroke-width="2"/>
  <text x="140" y="566" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A252F">Nhóm 2: Quản lý hồ sơ</text>
  <text x="140" y="583" text-anchor="middle" font-size="12" fill="#2C3E50">UC-05  UC-06</text>
  <text x="140" y="599" text-anchor="middle" font-size="12" fill="#2C3E50">UC-16 [một phần]</text>
  <text x="140" y="615" text-anchor="middle" font-size="12" fill="#2C3E50">UC-23 [API]</text>
  <text x="140" y="631" text-anchor="middle" font-size="11" fill="#666">(4 Use Case)</text>

  <!-- G5: cx=440 cy=590 -->
  <ellipse cx="440" cy="590" rx="118" ry="57" fill="#D6EAF8" stroke="#2471A3" stroke-width="2"/>
  <text x="440" y="566" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A252F">Nhóm 5: Tìm kiếm</text>
  <text x="440" y="582" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A252F">&amp; Xuất dữ liệu</text>
  <text x="440" y="600" text-anchor="middle" font-size="12" fill="#2C3E50">UC-04 [một phần]  UC-09</text>
  <text x="440" y="616" text-anchor="middle" font-size="12" fill="#2C3E50">UC-14  UC-15</text>
  <text x="440" y="632" text-anchor="middle" font-size="11" fill="#666">(4 Use Case)</text>

  <!-- ====== ARROWS: from actor (x=297,y=180) to each group ====== -->
  <!-- To XT (cx=140,cy=243) -->
  <line x1="277" y1="182" x2="204" y2="252" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- To G3 (cx=440,cy=243) -->
  <line x1="317" y1="182" x2="378" y2="252" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- To G1 (cx=140,cy=383) -->
  <line x1="271" y1="185" x2="174" y2="390" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- To G4 (cx=440,cy=383) -->
  <line x1="323" y1="185" x2="406" y2="392" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- To G2 (cx=140,cy=533) -->
  <line x1="266" y1="188" x2="163" y2="538" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- To G5 (cx=440,cy=533) -->
  <line x1="328" y1="188" x2="418" y2="538" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ====== LEGEND ====== -->
  <rect x="30" y="672" width="535" height="74" rx="6" fill="#F4F6F7" stroke="#AAB7B8" stroke-width="1"/>
  <text x="42" y="692" font-size="12" font-weight="bold" fill="#1A252F">Chú giải</text>
  <text x="42" y="710" font-size="11" fill="#444">Oval màu xanh = nhóm chức năng trong System Boundary (tên nhóm + Use Case IDs)</text>
  <text x="42" y="726" font-size="11" fill="#444">[một phần] = triển khai chưa đầy đủ     [API] = chỉ có API, chưa có giao diện</text>
  <text x="42" y="742" font-size="11" fill="#444">Mũi tên = Actor có quyền sử dụng nhóm chức năng (RBAC đã kiểm tra)</text>

  <!-- Page footer -->
  <text x="297" y="826" text-anchor="middle" font-size="10" fill="#999">Trang 1/6 · UCD-0A Quản trị viên (ADMIN) · Scopus–ICTU</text>
</svg>
