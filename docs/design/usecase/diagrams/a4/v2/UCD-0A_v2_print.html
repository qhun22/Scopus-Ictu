<style>

  .page {

    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: white;

    page-break-after: auto;
  }

    width: 210mm;
    height: 297mm;
    display: block;
  }

  /* PNG-based pages (P2-P5) */
  .page-png {
    flex-direction: column;
    padding: 8mm 8mm;
  }
  .page-png img {
    max-width: 100%;
    max-height: calc(297mm - 16mm);
    object-fit: contain;
    display: block;
    margin: auto;
  }

  @page {
    size: A4 portrait;
    margin: 0;
  }
  @media print {
    html, body { width: 210mm; }
    .page { page-break-after: always; }
  }
</style>
</head>
