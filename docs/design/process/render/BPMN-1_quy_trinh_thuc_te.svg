<text x="28" y="968" font-size="11" fill="#566573">Chú giải: 👤 nhiệm vụ của người · ⚙ nhiệm vụ dịch vụ tự động · ▤ script CLI · ◇✕ cổng loại trừ · ◇+ cổng song song · vòng đậm = sự kiện kết thúc · nguồn: gen_bpmn.py (mô hình trong tệp)</text>
